spring.profiles.active=prod

# Database
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.maximumPoolSize=32

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update

# Captcha
google.captcha.verifyUrl=https://www.google.com/recaptcha/api/siteverify

# URL config (overridden per profile)
api.customization.website.resetPasswordUrl=${api.customization.website.url}/confirmPasswordChange.html
api.customization.api.url=${api.customization.website.url}/API

# Trust reverse-proxy headers (X-Forwarded-For, X-Forwarded-Proto, etc.)
# Required because the app sits behind nginx which terminates SSL.
server.forward-headers-strategy=native

# Hide detailed error information from clients
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never
server.error.include-exception=false

# Disable the actuator endpoints (Actuator is not included but just to be safe)
management.endpoints.enabled-by-default=false
management.endpoint.health.enabled=false
management.endpoints.web.exposure.include=
management.endpoint.health.show-details=never

# Mail
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
spring.mail.properties.mail.smtp.socketFactory.port=465
spring.mail.properties.mail.smtp.socketFactory.class=javax.net.ssl.SSLSocketFactory
