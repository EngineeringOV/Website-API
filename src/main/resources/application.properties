spring.profiles.active=prod

# Database
spring.datasource.username=spring
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.maximumPoolSize=32

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update

# Captcha
google.captcha.verifyUrl=https://www.google.com/recaptcha/api/siteverify

# Mail
spring.mail.username=hello@example.org
spring.mail.host=mail.gandi.net
spring.mail.port=465
custom.mail.smtp.customerSupport=${spring.mail.username}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
spring.mail.properties.mail.smtp.socketFactory.port=465
spring.mail.properties.mail.smtp.socketFactory.class=javax.net.ssl.SSLSocketFactory

# URL config (overridden per profile)
api.customization.website.resetPasswordUrl=${api.customization.website.url}/confirmPasswordChange.html
api.customization.api.url=${api.customization.website.url}/API

# Hide detailed error information from clients
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never
server.error.include-exception=false

# Disable the actuator endpoints (Actuator is not included but just to be safe)
management.endpoints.enabled-by-default=false
management.endpoint.health.enabled=false
management.endpoints.web.exposure.include=
management.endpoint.health.show-details=never
