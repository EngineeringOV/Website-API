services:
  api:
    build: .
    container_name: website-api
    ports:
      - "8080:8080"
    environment:
      - DB_ROOT_PASSWORD=${DOCKER_DB_ROOT_PASSWORD:-password}
      - SPRING_DATASOURCE_URL=jdbc:mysql://ac-database:3306/acore_auth
      - SPRING_DATASOURCE_USERNAME=spring
      - SPRING_DATASOURCE_PASSWORD=${DOCKER_SPRING_DB_PASSWORD:-password}
    networks:
      - ac-network
    restart: unless-stopped

  nginx:
    profiles:
      - nginx
    build:
      context: ./src/main/html/website-container
      dockerfile: Dockerfile
    container_name: website-nginx
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
      - "${NGINX_HTTPS_PORT:-443}:443"
    environment:
      - NGINX_INDEX=${NGINX_INDEX:-page.html}
      - DOMAIN=${DOMAIN}
      - SUBDOMAIN=${SUBDOMAIN}
      - CERT_DOMAIN=${CERT_DOMAIN}
    volumes:
      - ./src/main/html/website-container/html:/usr/share/nginx/html:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot:ro
    networks:
      - ac-network
    restart: unless-stopped

networks:
  ac-network:
    external: true
    name: azerothcore-wotlk_ac-network